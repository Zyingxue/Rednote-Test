<!doctype html>
<html lang="zh-CN">
<head>

    * { box-sizing: border-box; }
    body {

    .shell { width: min(100% - 32px, 760px); margin: 0 auto; padding: 26px 0 54px; }

    main { margin-top: 28px; }
    .panel { background:rgba(251,250,246,.94); border:1px solid rgba(229,231,220,.9); border-radius:26px; box-shadow:var(--shadow); overflow:hidden; }

    .eyebrow { color:var(--green); font-size:12px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }

    .gate-form { width:min(100%, 350px); margin:0 auto; text-align:left; }
    label { display:block; color:#536157; font-size:13px; font-weight:650; margin-bottom:9px; }
    .pass-row { display:flex; gap:10px; }
    input[type="password"] { min-width:0; flex:1; border:1px solid #daddd1; outline:0; background:#fff; border-radius:12px; padding:13px 15px; letter-spacing:.3em; transition:border .2s, box-shadow .2s; }
    input[type="password"]:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(83,109,85,.13); }
    .primary, .secondary { border:0; border-radius:12px; padding:13px 19px; cursor:pointer; font-weight:700; transition:transform .15s, background .15s; }
    .primary { background:var(--green-dark); color:white; }
    .primary:hover { background:#263b2b; transform:translateY(-1px); }
    .secondary { background:var(--soft); color:var(--green-dark); }
    .secondary:hover { background:#e5e9dd; }
    .error { min-height:20px; margin:9px 0 0; color:#a04d3b; font-size:13px; }
    .footnote { color:#9a9f94; font-size:12px; margin:16px 0 0; line-height:1.6; }
    .test-panel { padding:clamp(23px, 5vw, 42px); }
    .test-head { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:22px; }
    .test-title { margin:0; font-family:Georgia,"Songti SC",serif; font-size:clamp(23px,5vw,30px); }
    .count { color:var(--muted); font-size:13px; white-space:nowrap; }
    .progress-track { height:5px; border-radius:9px; background:#e9ebe2; overflow:hidden; margin-bottom:30px; }
    .progress-fill { height:100%; width:0; border-radius:9px; background:linear-gradient(90deg,#758e6c,#c69b5a); transition:width .25s; }
    .question-number { color:var(--gold); font:700 13px Georgia,serif; letter-spacing:.12em; }
    .question { margin:12px 0 25px; font-size:clamp(21px,5vw,27px); line-height:1.5; font-weight:700; }
    .options { display:grid; gap:12px; }
    .option { display:flex; align-items:flex-start; gap:14px; width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:15px; padding:17px 18px; cursor:pointer; line-height:1.65; transition:border .16s, background .16s, transform .16s; }
    .option:hover { border-color:#aab79f; transform:translateY(-1px); }
    .option.selected { background:#f0f3eb; border-color:#71886d; box-shadow:inset 0 0 0 1px #71886d; }
    .option-key { display:grid; place-items:center; flex:0 0 29px; height:29px; border-radius:50%; background:#f1f1ea; color:#687568; font-size:13px; font-weight:800; }
    .option.selected .option-key { color:#fff; background:var(--green); }
    .option-text { padding-top:2px; }
    .nav { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:25px; }
    .nav .primary:disabled { cursor:not-allowed; opacity:.42; transform:none; }
    .nav-hint { color:#9a9f94; font-size:12px; }
    .result-panel { padding:clamp(24px,6vw,48px); text-align:center; }
    .result-kicker { color:var(--green); font-size:12px; letter-spacing:.17em; font-weight:750; }
    .illustration { width:min(100%,400px); margin:12px auto 4px; border-radius:22px; background:radial-gradient(circle at 50% 54%,#eef1e7 0,#f7f6ee 65%,transparent 72%); }
    .illustration img { display:block; width:100%; height:240px; object-fit:contain; }
    .result-animal { margin:12px 0 5px; font-family:Georgia,"Songti SC",serif; font-size:clamp(39px,10vw,64px); line-height:1.2; }
    .result-copy { max-width:550px; margin:24px auto 0; color:#536157; font-size:16px; line-height:2; text-align:left; background:#f3f3ec; border-radius:17px; padding:22px 24px; }
    .result-section { max-width:550px; margin:27px auto 0; text-align:left; }
    .result-section h3 { margin:0 0 12px; color:var(--green-dark); font-size:17px; }
    .insight-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:11px; }
    .insight { padding:16px; border:1px solid var(--line); border-radius:15px; background:white; }
    .insight strong { display:block; color:var(--green-dark); font-size:14px; }
    .insight p { color:#536157; font-size:13px; line-height:1.75; margin:7px 0 0; }
    .baike-card { background:#f1f3ed; border-radius:15px; padding:18px 20px; }
    .baike-card p { color:#536157; line-height:1.8; margin:0 0 10px; font-size:14px; }
    .baike-card small { color:#899184; line-height:1.6; }
    .result-actions { display:flex; justify-content:center; gap:11px; flex-wrap:wrap; margin-top:25px; }
    .result-note { margin:22px auto 0; max-width:560px; color:#999f93; font-size:11px; line-height:1.7; }
    .hidden { display:none !important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:520px) {
      .shell { width:min(100% - 22px,760px); padding-top:18px; }
      main { margin-top:20px; }
      .panel { border-radius:20px; }
      .privacy { font-size:11px; }
      .pass-row { flex-direction:column; }
      .pass-row .primary { width:100%; }
      .option { padding:15px 14px; }
      .nav-hint { display:none; }
      .insight-grid { grid-template-columns:1fr; }
      .illustration img { height:205px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topline">
      <div class="brand"><span class="brand-mark" aria-hidden="true">❧</span>自然观察手册</div>
      <div class="privacy">仅在本地运行</div>
    </header>
    <main>
      <section class="panel gate" id="gate" aria-labelledby="page-title">
        <div class="eyebrow">PERSONALITY TEST · 24 QUESTIONS</div>
        <h1 id="page-title">你是自然界里的<br>哪种动物？</h1>
        <p class="subtitle">用 24 个 A / B 选择，看看你的性格更接近哪一种自然生灵。没有标准答案，凭第一直觉作答就好。</p>
        <div class="divider"></div>
        <form class="gate-form" id="gate-form">
          <label for="passcode">输入权限验证码，开启测试</label>
          <div class="pass-row">
            <input id="passcode" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••" aria-describedby="gate-error" required>
            <button class="primary" type="submit">进入测试</button>
          </div>
          <p class="error" id="gate-error" role="alert"></p>
        </form>
        <p class="footnote">本测试不收集、不上传任何信息；作答仅保存在当前页面中，关闭或重置后即清除。</p>
      </section>

      <section class="panel test-panel hidden" id="test" aria-labelledby="test-title">
        <div class="test-head">
          <h2 class="test-title" id="test-title">跟随直觉作答</h2>
          <span class="count" id="count">第 1 / 24 题</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="24" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div>
        <div id="question-area" aria-live="polite"></div>
        <div class="nav">
          <button class="secondary" id="prev" type="button">上 一 题</button>
          <span class="nav-hint">选择更像你的那一项</span>
          <button class="primary" id="next" type="button" disabled>下一题</button>
        </div>
      </section>

      <section class="panel result-panel hidden" id="result" aria-labelledby="result-name" aria-live="polite">
        <div class="result-kicker">YOUR WILD SELF</div>
        <div class="illustration"><img id="result-image" alt="" width="320" height="240"></div>
        <h2 class="result-animal" id="result-name"></h2>
        <div class="result-copy" id="result-copy"></div>
        <div class="result-section"><h3>从你的答案里，看见这些侧面</h3><div class="insight-grid" id="insight-grid"></div></div>
        <div class="result-section baike-card"><h3>动物小档案 · 认识真实的它</h3><p id="baike-copy"></p><small>这里介绍的是动物的自然特征，与你的性格侧写分别阅读更有趣。</small></div>
        <div class="result-actions">
          <button class="primary" id="restart" type="button">重新测试</button>
          <button class="secondary" id="back-to-answers" type="button">回看答案</button>
        </div>
        <p class="result-note">测试结果仅供娱乐与自我观察，不代表专业心理评估。</p>
      </section>
    </main>
  </div>

  };
  const insights = [
    { title:'面对未知', ids:[0,12], bothA:'你更愿意先观察陌生环境，遇到风险也会优先隐蔽自保；审慎，是你给自己的缓冲空间。', bothB:'你喜欢先探索新鲜事物，遇到风险也倾向快速行动；行动让你更快找到出口。', aThenB:'陌生环境里你先观察，但真遇到危险会迅速逃离或反击；你把谨慎留给准备，把果断留给关键时刻。', bThenA:'你对陌生地方充满探索欲，真正遇到危险时却会先藏好自己；好奇和自我保护可以同时存在。' },
    { title:'亲密与依靠', ids:[2,20], bothA:'你珍惜独处，脆弱时也更愿意先自己消化；私人空间会帮你恢复能量。', bothB:'你喜欢有人陪伴，难过时也愿意向同伴求助；连接是你的安全感来源。', aThenB:'平时你需要独处和安静，但受伤时愿意寻求庇护；你不是不需要人，只是更在意陪伴出现的时机。', bThenA:'你喜欢与同伴相伴，却倾向在脆弱时独自静养；热闹与私密都是你需要的空间。' },
    { title:'目标的节奏', ids:[7,23], bothA:'你会耐心等待机会，也愿意为长期目标守候；比起速度，你更看重时机。', bothB:'你偏向主动争取、把握眼前机会；想做的事，你更愿意马上开始。', aThenB:'你能潜伏等待争取的时机，但面对目标更珍惜眼前的机会；等待是手段，不是拖延。', bThenA:'你愿意主动出击争取机会，同时也能为重要目标长期守候；行动力和耐心并不冲突。' },
    { title:'边界与表达', ids:[8,15], bothA:'你重视私人边界，好感也倾向默默表达；亲近并不意味着必须毫无保留。', bothB:'你愿意接纳别人靠近，也乐于直接表达善意；热情是你建立联系的方式。', aThenB:'你很在意私人边界，却不吝于直接表达好感；清楚底线，才能更安心地热情。', bThenA:'你愿意接纳别人靠近，却喜欢用默默关照表达好感；开放并不一定要高调。' }
  ];

  const gate = document.getElementById('gate');
  const test = document.getElementById('test');
  const result = document.getElementById('result');
  const form = document.getElementById('gate-form');
  const input = document.getElementById('passcode');
  const error = document.getElementById('gate-error');
  const area = document.getElementById('question-area');
  const count = document.getElementById('count');
  const fill = document.getElementById('progress-fill');
  const progress = document.querySelector('[role="progressbar"]');
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  let current = 0;
  const answers = Array(questions.length).fill(null);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (input.value.trim() !== ACCESS_CODE) {
      error.textContent = '验证码不正确，请再试一次。';
      input.select();
      return;
    }
    error.textContent = '';
    gate.classList.add('hidden');
    test.classList.remove('hidden');
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  input.addEventListener('input', () => { error.textContent = ''; });

  function renderQuestion() {
    const [prompt, a, b] = questions[current];
    count.textContent = `第 ${current + 1} / ${questions.length} 题`;
    fill.style.width = `${(current / questions.length) * 100}%`;
    progress.setAttribute('aria-valuenow', String(current));
    area.innerHTML = '';
    const num = document.createElement('div');
    num.className = 'question-number';
    num.textContent = `QUESTION ${String(current + 1).padStart(2, '0')}`;
    const title = document.createElement('h3');
    title.className = 'question';
    title.textContent = prompt;
    area.append(num, title);
    const options = document.createElement('div');
    options.className = 'options';
    [a, b].forEach((text, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `option${answers[current] === index ? ' selected' : ''}`;
      button.setAttribute('aria-pressed', answers[current] === index ? 'true' : 'false');
      const key = document.createElement('span');
      key.className = 'option-key';
      key.textContent = index === 0 ? 'A' : 'B';
      const label = document.createElement('span');
      label.className = 'option-text';
      label.textContent = text;
      button.append(key, label);
      button.addEventListener('click', () => {
        answers[current] = index;
        renderQuestion();
      });
      options.appendChild(button);
    });
    area.appendChild(options);
    prev.disabled = current === 0;
    prev.style.opacity = current === 0 ? '.45' : '1';
    next.disabled = answers[current] === null;
    next.textContent = current === questions.length - 1 ? '查看结果' : '下一题';
  }
  prev.addEventListener('click', () => { if (current > 0) { current--; renderQuestion(); } });
  next.addEventListener('click', () => {
    if (answers[current] === null) return;
    if (current < questions.length - 1) { current++; renderQuestion(); }
    else showResult();
  });

  function showResult() {
    const aCount = answers.reduce((sum, value) => sum + (value === 0 ? 1 : 0), 0);
    const matched = results.find(item => aCount >= item.min && aCount <= item.max);
    document.getElementById('result-name').textContent = matched.name;
    document.getElementById('result-copy').textContent = matched.copy;
    const image = document.getElementById('result-image');
    image.src = `animals/${slugs[results.indexOf(matched)]}.svg`;
    image.alt = `${matched.name}的原创卡通插画`;
    const grid = document.getElementById('insight-grid');
    grid.replaceChildren();
    insights.forEach(item => {
      const [first, second] = item.ids.map(index => answers[index]);
      const card = document.createElement('div');
      card.className = 'insight';
      const heading = document.createElement('strong');
      heading.textContent = item.title;
      const text = document.createElement('p');
      text.textContent = first === second ? (first === 0 ? item.bothA : item.bothB) : (first === 0 ? item.aThenB : item.bThenA);
      card.append(heading, text);
      grid.appendChild(card);
    });
    const fact = animalFacts[matched.name];
    document.getElementById('baike-copy').textContent = fact.summary;
    test.classList.add('hidden');
    result.classList.remove('hidden');
    fill.style.width = '100%';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  document.getElementById('restart').addEventListener('click', () => {
    answers.fill(null);
    current = 0;
    result.classList.add('hidden');
    gate.classList.remove('hidden');
    input.value = '';
    error.textContent = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
    input.focus();
  });
  document.getElementById('back-to-answers').addEventListener('click', () => {
    result.classList.add('hidden');
    test.classList.remove('hidden');
    current = questions.length - 1;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
